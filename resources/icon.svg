<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#1D4ED8"/>

  <!-- Checklist lines -->
  <!-- Row 1: checked -->
  <circle cx="148" cy="178" r="30" fill="none" stroke="white" stroke-width="18"/>
  <polyline points="133,178 145,191 165,162" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="200" y="164" width="168" height="18" rx="9" fill="white"/>

  <!-- Row 2: checked -->
  <circle cx="148" cy="256" r="30" fill="none" stroke="white" stroke-width="18"/>
  <polyline points="133,256 145,269 165,240" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="200" y="242" width="130" height="18" rx="9" fill="white"/>

  <!-- Row 3: unchecked -->
  <circle cx="148" cy="334" r="30" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="18"/>
  <rect x="200" y="320" width="150" height="18" rx="9" fill="rgba(255,255,255,0.45)"/>
</svg>
